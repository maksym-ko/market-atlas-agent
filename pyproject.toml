[project]
name = "market-atlas-agent"
version = "0.1.0"
description = "AI analyst that tells founders where to launch, using World Bank data"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "python-dotenv>=1",
    "httpx>=0.27",
    "pandas>=2.2",
    "plotly>=5.22",
    "nicegui>=2.0",
    "nh3>=0.2",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2",
    "langchain>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-openai>=1.0",
    "mcp>=1.2",
    "statsmodels>=0.14",
    "langchain-mcp-adapters>=0.3.2",
    "tavily-python>=0.8.5",
    "langchain-ollama>=1.0",
    "pinecone>=7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
